<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="에이아이소프트">
  <!-- 브라우저 탭 파비콘: 라운드 마크(탭 아이콘은 라운드가 자연스러움) -->
  <defs>
    <linearGradient id="ais-brand" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f5b400"/>
    </linearGradient>
    <radialGradient id="ais-sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 0) scale(410)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#ais-brand)"/>
  <rect width="512" height="512" rx="120" fill="url(#ais-sheen)"/>
  <!-- v8: 노랑 배경 위 흰 원은 대비 1.53로 안 보임 → near-black 심볼(12.13, 카카오식) -->
  <circle cx="256" cy="256" r="82" fill="#1a1200"/>
</svg>
