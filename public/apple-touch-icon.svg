<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="에이아이소프트">
  <!-- 홈화면 아이콘: 꽉 찬 사각(OS가 라운드 마스크를 씌우므로 모서리까지 채움 → 흰 모서리 방지) -->
  <defs>
    <linearGradient id="ait-brand" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f5b400"/>
    </linearGradient>
    <radialGradient id="ait-sheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(0 0) scale(410)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#ait-brand)"/>
  <rect width="512" height="512" fill="url(#ait-sheen)"/>
  <!-- v8: 노랑 배경 위 near-black 심볼(대비 12.13, 흰 원은 1.53로 안 보임) -->
  <circle cx="256" cy="256" r="86" fill="#1a1200"/>
</svg>
